data:
  dataset: APTOS
  seed: 2026
  label_min_max: [0.001, 0.999]
  num_classes: 5
  num_workers: 4
  dataroot: ${APTOS_ROOT}
  splits_manifest: outputs/aptos_splits.json
  aux_checkpoint: ${DIFFMIC_AUX_CHECKPOINT}
model:
  type: simple
  data_dim: 150528
  n_input_channels: 3
  n_input_padding: 0
  feature_dim: 6144
  hidden_dim: 6144
  cat_x: true
  cat_y_pred: true
  arch: resnet18
  var_type: fixedlarge
  ema_rate: 0.9999
  ema: true
  num_k: 6
diffusion:
  beta_schedule: linear
  beta_start: 0.0001
  beta_end: 0.02
  timesteps: 1000
  test_timesteps: 100
  vis_step: 100
  num_figs: 10
  include_guidance: true
  apply_aux_cls: true
  aux_cls:
    arch: resnet18_ckpt
    pre_train: true
    joint_train: false
    n_pretrain_epochs: 10
    logging_interval: 1
training:
  batch_size: 32
  n_epochs: 1000
  warmup_epochs: 40
  validation_freq: 5
  logging_freq: 100
  snapshot_freq: 1
  image_folder: outputs/training_images
testing:
  batch_size: 32
optim:
  optimizer: Adam
  lr: 0.001
  weight_decay: 0.0
  beta1: 0.9
  amsgrad: false
  eps: 1.0e-8
  min_lr: 1.0e-6
  grad_clip: 1.0
